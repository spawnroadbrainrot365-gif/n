
name: Windows + Tailscale + Roblox

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installerPath -Force

      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not $env:TS_AUTHKEY) {
            throw "TAILSCALE_AUTHKEY secret is missing."
          }

          & $tsExe up `
            --authkey=$env:TS_AUTHKEY `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          $tsIP = $null

          for ($i = 0; $i -lt 12; $i++) {
            $tsIP = & $tsExe ip -4

            if ($tsIP) {
              break
            }

            Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
            throw "Tailscale IP was not assigned."
          }

          Write-Host "Tailscale IP: $tsIP"

      - name: Open Roblox in Microsoft Edge
        shell: powershell
        run: |
          $edgePaths = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
          )

          $edgePath = $edgePaths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $edgePath) {
            throw "Microsoft Edge was not found."
          }

          Start-Process -FilePath $edgePath `
            -ArgumentList "https://www.roblox.com"

          Write-Host "Roblox opened in Microsoft Edge."

      - name: Keep Runner Alive
        shell: powershell
        run: |
          while ($true) {
            Write-Host "[$(Get-Date)] Windows Runner is active."
            Start-Sleep -Seconds 300
          }
